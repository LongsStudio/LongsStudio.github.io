<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>班级抽号工具</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== 主卡片 ===== */
        .container {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            padding: 32px 30px 38px;
        }

        /* ===== 设置区域 ===== */
        .settings {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .settings label {
            font-size: 15px;
            font-weight: 500;
            color: #1e293b;
        }
        .settings input[type="number"] {
            width: 80px;
            padding: 8px 6px;
            border: none;
            background: #f4f7fc;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            color: #1a2b4a;
            outline: none;
            transition: background 0.2s;
        }
        .settings input[type="number"]:focus {
            background: #eaf0fa;
        }
        .settings .btn-set {
            padding: 8px 20px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .settings .btn-set:hover {
            background: #2563eb;
        }
        .settings .btn-set:active {
            transform: scale(0.96);
        }

        /* ===== 显示区域 ===== */
        .display-area {
            background: #ffffff;
            padding: 18px 10px 22px;
            margin-bottom: 24px;
            position: relative;
        }
        .display-circle {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            border-radius: 50%;
            background: #f8faff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .display-circle .number {
            font-size: 80px;
            font-weight: 800;
            color: #1a2b4a;
            line-height: 1;
            user-select: none;
            transition: color 0.2s;
            font-family: "Arial Black", "Impact", sans-serif;
        }
        .display-circle .number.placeholder {
            font-size: 28px;
            font-weight: 400;
            color: #b0c0d8;
        }
        .display-circle .number.rolling {
            color: #3b82f6;
        }
        .display-circle .number.done {
            color: #10b981;
        }

        /* ===== 统计信息 ===== */
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 16px;
            font-size: 15px;
            color: #334155;
            font-weight: 500;
        }
        .stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stats .stat-item .num {
            font-weight: 700;
            font-size: 18px;
            color: #1a2b4a;
            min-width: 28px;
            text-align: center;
        }
        .stats .stat-item .num.blue {
            color: #3b82f6;
        }
        .stats .stat-item .num.green {
            color: #10b981;
        }
        .stats .stat-item .num.orange {
            color: #f59e0b;
        }

        /* ===== 操作按钮 ===== */
        .actions {
            display: flex;
            gap: 14px;
            margin-bottom: 26px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .actions .btn {
            flex: 1;
            min-width: 120px;
            padding: 14px 10px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .actions .btn:active {
            transform: scale(0.96);
        }
        .actions .btn-primary {
            background: #3b82f6;
            color: #fff;
        }
        .actions .btn-primary:hover {
            background: #2563eb;
        }
        .actions .btn-primary:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .actions .btn-danger {
            background: #f1f5f9;
            color: #475569;
        }
        .actions .btn-danger:hover {
            background: #e2e8f0;
        }
        .actions .btn .icon {
            font-size: 22px;
            line-height: 1;
        }

        /* ===== 历史记录 ===== */
        .history {
            padding-top: 18px;
        }
        .history .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .history .history-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }
        .history .history-header .count-badge {
            background: #f1f5f9;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }
        .history .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
            padding: 4px 2px 6px;
            align-content: flex-start;
        }
        .history .history-list::-webkit-scrollbar {
            width: 6px;
        }
        .history .history-list::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .history .history-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .history .tag {
            display: inline-block;
            background: #eef2ff;
            color: #1e3a8a;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            transition: background 0.15s;
            line-height: 1.6;
        }
        .history .tag.latest {
            background: #3b82f6;
            color: #fff;
        }
        .history .empty-tip {
            color: #94a3b8;
            font-size: 14px;
            padding: 8px 0 4px;
            width: 100%;
            text-align: center;
        }

        /* ===== 全部抽完提示 ===== */
        .all-done-msg {
            display: none;
            text-align: center;
            background: #fef3c7;
            color: #92400e;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 18px;
            border: none;
        }
        .all-done-msg.show {
            display: block;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .container {
                padding: 22px 16px 28px;
            }
            .display-circle {
                width: 160px;
                height: 160px;
            }
            .display-circle .number {
                font-size: 64px;
            }
            .display-circle .number.placeholder {
                font-size: 22px;
            }
            .actions .btn {
                font-size: 16px;
                padding: 12px 8px;
                min-width: 100px;
            }
            .settings input[type="number"] {
                width: 68px;
                font-size: 16px;
            }
            .stats {
                font-size: 13px;
                flex-wrap: wrap;
                gap: 6px;
            }
        }

        @media (max-width: 380px) {
            .display-circle {
                width: 130px;
                height: 130px;
            }
            .display-circle .number {
                font-size: 52px;
            }
            .actions .btn {
                font-size: 14px;
                min-width: 80px;
                padding: 10px 6px;
            }
            .container {
                padding: 16px 10px 20px;
            }
        }

        /* ===== IE 兼容补丁 ===== */
        .settings .ie-gap-fix {
            margin-right: 10px;
        }
        .settings .ie-gap-fix:last-child {
            margin-right: 0;
        }
        .actions .ie-gap-fix {
            margin-right: 14px;
        }
        .actions .ie-gap-fix:last-child {
            margin-right: 0;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- 标题已移除 -->

        <!-- 设置 -->
        <div class="settings">
            <label for="totalInput">总人数</label>
            <input type="number" id="totalInput" value="50" min="1" max="999">
            <button class="btn-set" id="setBtn">设置</button>
        </div>

        <!-- 全部抽完提示 -->
        <div class="all-done-msg" id="allDoneMsg">🎉 所有号码已抽完！</div>

        <!-- 显示区域 -->
        <div class="display-area">
            <div class="display-circle" id="displayCircle">
                <div class="number placeholder" id="displayNumber">准备</div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    ✅ 已抽 <span class="num blue" id="drawnCount">0</span>
                </div>
                <div class="stat-item">
                    📌 剩余 <span class="num green" id="remainCount">50</span>
                </div>
                <div class="stat-item">
                    📊 总数 <span class="num orange" id="totalCount">50</span>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="actions">
            <button class="btn btn-primary" id="drawBtn">
                <span class="icon">🎲</span> 抽号
            </button>
            <button class="btn btn-danger" id="resetBtn">
                <span class="icon">🔄</span> 重置
            </button>
        </div>

        <!-- 历史记录 -->
        <div class="history">
            <div class="history-header">
                <h3>📋 已抽取号码</h3>
                <span class="count-badge" id="historyBadge">0 个</span>
            </div>
            <div class="history-list" id="historyList">
                <span class="empty-tip">还没有抽取记录</span>
            </div>
        </div>
    </div>

    <script>
        /* ============================================================
               班级抽号工具 - 兼容 IE (ES5 语法)
               移除标题，抽号完成时弹出 alert
               ============================================================ */

        (function() {
            "use strict";

            // ---------- DOM 引用 ----------
            var totalInput = document.getElementById('totalInput');
            var setBtn = document.getElementById('setBtn');
            var drawBtn = document.getElementById('drawBtn');
            var resetBtn = document.getElementById('resetBtn');
            var displayNumber = document.getElementById('displayNumber');
            var displayCircle = document.getElementById('displayCircle');
            var drawnCountEl = document.getElementById('drawnCount');
            var remainCountEl = document.getElementById('remainCount');
            var totalCountEl = document.getElementById('totalCount');
            var historyList = document.getElementById('historyList');
            var historyBadge = document.getElementById('historyBadge');
            var allDoneMsg = document.getElementById('allDoneMsg');

            // ---------- 状态 ----------
            var total = 50;
            var drawn = [];
            var isRolling = false;
            var rollTimer = null;
            var rollTimeout = null;

            // ---------- 辅助函数 ----------
            function isArrayEmpty(arr) {
                return !arr || arr.length === 0;
            }

            function getRemain() {
                return total - drawn.length;
            }

            function updateStats() {
                var remain = getRemain();
                drawnCountEl.textContent = drawn.length;
                remainCountEl.textContent = remain;
                totalCountEl.textContent = total;
                historyBadge.textContent = drawn.length + ' 个';

                if (remain === 0 && total > 0) {
                    allDoneMsg.className = 'all-done-msg show';
                } else {
                    allDoneMsg.className = 'all-done-msg';
                }

                if (remain === 0 || isRolling) {
                    drawBtn.disabled = true;
                } else {
                    drawBtn.disabled = false;
                }
            }

            function updateHistory() {
                while (historyList.firstChild) {
                    historyList.removeChild(historyList.firstChild);
                }

                if (isArrayEmpty(drawn)) {
                    var tip = document.createElement('span');
                    tip.className = 'empty-tip';
                    tip.textContent = '还没有抽取记录';
                    historyList.appendChild(tip);
                    return;
                }

                for (var i = 0; i < drawn.length; i++) {
                    var tag = document.createElement('span');
                    tag.className = 'tag';
                    if (i === drawn.length - 1) {
                        tag.className += ' latest';
                    }
                    tag.textContent = drawn[i];
                    historyList.appendChild(tag);
                }
            }

            function resetAll() {
                stopRolling();
                drawn = [];
                displayNumber.textContent = '准备';
                displayNumber.className = 'number placeholder';
                updateStats();
                updateHistory();
            }

            function stopRolling() {
                if (rollTimer) {
                    clearInterval(rollTimer);
                    rollTimer = null;
                }
                if (rollTimeout) {
                    clearTimeout(rollTimeout);
                    rollTimeout = null;
                }
                isRolling = false;
                drawBtn.disabled = false;
            }

            function randomInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            function isDrawn(num) {
                for (var i = 0; i < drawn.length; i++) {
                    if (drawn[i] === num) {
                        return true;
                    }
                }
                return false;
            }

            function getAvailable() {
                var available = [];
                for (var i = 1; i <= total; i++) {
                    if (!isDrawn(i)) {
                        available.push(i);
                    }
                }
                return available;
            }

            // ---------- 核心：抽号 ----------
            function performDraw() {
                if (isRolling) {
                    return;
                }

                var remain = getRemain();
                if (remain <= 0) {
                    return;
                }

                var available = getAvailable();
                if (available.length === 0) {
                    return;
                }

                isRolling = true;
                drawBtn.disabled = true;

                var finalIndex = randomInt(0, available.length - 1);
                var finalNumber = available[finalIndex];

                var rollCount = 0;
                var maxRolls = 20 + randomInt(5, 15);
                var intervalMs = 40;

                if (rollTimer) {
                    clearInterval(rollTimer);
                    rollTimer = null;
                }

                displayNumber.className = 'number rolling';

                rollTimer = setInterval(function() {
                    var randomIdx = randomInt(0, available.length - 1);
                    var showNum = available[randomIdx];
                    displayNumber.textContent = showNum;
                    displayNumber.className = 'number rolling';
                    rollCount++;

                    if (rollCount >= maxRolls) {
                        clearInterval(rollTimer);
                        rollTimer = null;

                        // 显示最终号码
                        displayNumber.textContent = finalNumber;
                        displayNumber.className = 'number done';

                        // 添加到已抽取列表
                        drawn.push(finalNumber);

                        // 更新界面
                        updateStats();
                        updateHistory();

                        // 弹窗提示抽到的号码
                        alert('抽到的号数是：' + finalNumber);

                        isRolling = false;
                        drawBtn.disabled = (getRemain() === 0);
                    }
                }, intervalMs);
            }

            // ---------- 设置总人数 ----------
            function setTotal() {
                stopRolling();

                var val = parseInt(totalInput.value, 10);
                if (isNaN(val) || val < 1) {
                    val = 1;
                    totalInput.value = 1;
                }
                if (val > 999) {
                    val = 999;
                    totalInput.value = 999;
                }

                total = val;
                drawn = [];
                displayNumber.textContent = '准备';
                displayNumber.className = 'number placeholder';
                updateStats();
                updateHistory();
            }

            // ---------- 事件绑定 ----------
            if (setBtn.addEventListener) {
                setBtn.addEventListener('click', setTotal);
            } else {
                setBtn.attachEvent('onclick', setTotal);
            }

            if (drawBtn.addEventListener) {
                drawBtn.addEventListener('click', performDraw);
            } else {
                drawBtn.attachEvent('onclick', performDraw);
            }

            if (resetBtn.addEventListener) {
                resetBtn.addEventListener('click', resetAll);
            } else {
                resetBtn.attachEvent('onclick', resetAll);
            }

            if (totalInput.addEventListener) {
                totalInput.addEventListener('keydown', function(e) {
                    var ev = e || window.event;
                    var key = ev.keyCode || ev.which;
                    if (key === 13) {
                        setTotal();
                        ev.preventDefault ? ev.preventDefault() : (ev.returnValue = false);
                    }
                });
            } else {
                totalInput.attachEvent('onkeydown', function(e) {
                    var ev = e || window.event;
                    var key = ev.keyCode || ev.which;
                    if (key === 13) {
                        setTotal();
                        ev.returnValue = false;
                    }
                });
            }

            document.addEventListener('keydown', function(e) {
                var ev = e || window.event;
                var key = ev.keyCode || ev.which;
                if (key === 32 && document.activeElement !== totalInput) {
                    ev.preventDefault ? ev.preventDefault() : (ev.returnValue = false);
                    if (!drawBtn.disabled) {
                        performDraw();
                    }
                }
            });

            // ---------- 初始化 ----------
            function init() {
                total = 50;
                totalInput.value = 50;
                drawn = [];
                displayNumber.textContent = '准备';
                displayNumber.className = 'number placeholder';
                updateStats();
                updateHistory();
            }

            init();

        })();
    </script>

</body>
</html>
