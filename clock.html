<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <title>时钟 · 倒计时 · 正计时</title>
    <style>
        /* ----- 全局重置 & 基础 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            color: #222222;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background 0.2s;
        }

        /* ----- 主容器：无边框 ----- */
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 20px 25px 30px;
            transition: all 0.3s ease;
        }

        /* ===== 标签页 ===== */
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 22px;
            justify-content: center;
            transition: opacity 0.3s, transform 0.3s;
        }
        .tab-btn {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
            margin-bottom: -2px;
            letter-spacing: 0.5px;
            user-select: none;
            min-width: 80px;
            text-align: center;
        }
        .tab-btn:hover {
            color: #222;
            background: #f5f5f5;
        }
        .tab-btn.active {
            color: #2c7be0;
            border-bottom-color: #2c7be0;
            background: transparent;
        }
        .tab-btn {
            margin-right: 4px;
        }
        .tab-btn:last-child {
            margin-right: 0;
        }

        /* ----- 面板容器 ----- */
        .panel {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .panel.active {
            display: block;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0.6;
            }
            100% {
                opacity: 1;
            }
        }

        /* ----- 各区块标题 ----- */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #444;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            transition: opacity 0.3s, transform 0.3s;
        }

        /* ----- 时钟显示：无边框，纯文本 ----- */
        .clock-display {
            font-size: 58px;
            font-weight: 300;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            letter-spacing: 6px;
            color: #1a1a1a;
            padding: 18px 0;
            user-select: none;
            transition: all 0.3s ease;
        }

        /* ===== 倒计时输入区域 ===== */
        .countdown-inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            transition: opacity 0.25s ease, transform 0.25s ease, max-height 0.3s;
            overflow: hidden;
        }
        .countdown-inputs.hidden {
            display: none;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 步进按钮 */
        .step-btn {
            width: 30px;
            height: 36px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            color: #333;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            text-align: center;
            line-height: 34px;
            padding: 0;
            transition: background 0.15s, border-color 0.15s;
            flex-shrink: 0;
        }
        .step-btn:hover:not(:disabled) {
            background: #e8e8e8;
            border-color: #aaa;
        }
        .step-btn:active:not(:disabled) {
            background: #ddd;
        }
        .step-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f0f0f0;
            border-color: #ddd;
            color: #999;
        }

        /* 数字输入框 */
        .input-group input[type="number"] {
            width: 52px;
            height: 36px;
            text-align: center;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fafafa;
            padding: 0 2px;
            outline: none;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }
        .input-group input[type="number"]:focus {
            border-color: #888;
            background: #fff;
        }
        .input-group input[type="number"]:disabled {
            background: #f0f0f0;
            color: #999;
            border-color: #ddd;
        }
        .input-group input[type="number"]::-webkit-inner-spin-button,
        .input-group input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-group .label {
            font-size: 16px;
            color: #555;
            font-weight: 500;
            margin-left: 2px;
            min-width: 14px;
        }

        /* ----- 按钮组 ----- */
        .btn-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 8px 0 10px;
            transition: opacity 0.3s, transform 0.3s;
        }
        .btn {
            display: inline-block;
            padding: 8px 22px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            color: #333;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, opacity 0.15s;
            user-select: none;
            min-width: 64px;
            text-align: center;
        }
        .btn:hover:not(:disabled) {
            background: #e8e8e8;
            border-color: #aaa;
        }
        .btn:active:not(:disabled) {
            background: #ddd;
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: #f0f0f0;
            border-color: #ddd;
            color: #999;
        }
        .btn-success {
            background: #27ae60;
            border-color: #27ae60;
            color: #fff;
        }
        .btn-success:hover:not(:disabled) {
            background: #1e8f4e;
            border-color: #1e8f4e;
        }
        .btn-danger {
            background: #e74c3c;
            border-color: #e74c3c;
            color: #fff;
        }
        .btn-danger:hover:not(:disabled) {
            background: #c0392b;
            border-color: #c0392b;
        }
        .btn-warning {
            background: #f39c12;
            border-color: #f39c12;
            color: #fff;
        }
        .btn-warning:hover:not(:disabled) {
            background: #d68910;
            border-color: #d68910;
        }

        /* ----- 时间显示 (倒计时/正计时) 无边框无背景 ----- */
        .time-display {
            font-size: 42px;
            font-weight: 300;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            letter-spacing: 4px;
            color: #1a1a1a;
            padding: 12px 0;
            user-select: none;
            min-height: 62px;
            line-height: 1.3;
            transition: all 0.3s ease;
        }
        .time-display .timeout-msg {
            color: #e74c3c;
            font-weight: 600;
            font-size: 28px;
            letter-spacing: 2px;
        }
        .time-display .normal-time {
            color: #1a1a1a;
        }

        /* ----- IE 兼容 margin 替代 gap ----- */
        .input-group {
            margin-right: 4px;
        }
        .input-group:last-child {
            margin-right: 0;
        }
        .btn-group .btn {
            margin-right: 6px;
        }
        .btn-group .btn:last-child {
            margin-right: 0;
        }
        .countdown-inputs {
            margin-left: -6px;
            margin-right: -6px;
        }
        .input-group {
            margin-left: 6px;
            margin-right: 6px;
        }
        .btn-group {
            margin-left: -5px;
            margin-right: -5px;
        }
        .btn-group .btn {
            margin-left: 5px;
            margin-right: 5px;
        }

        /* ============================================================ */
        /* ===== 全屏按钮 (右下角 fixed) ===== */
        #fullscreenBtn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(44, 123, 224, 0.15);
            color: #2c7be0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
            z-index: 9999;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 0;
        }
        #fullscreenBtn:hover {
            background: rgba(44, 123, 224, 0.28);
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }
        #fullscreenBtn:active {
            transform: scale(0.92);
        }
        #fullscreenBtn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #2c7be0;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.25s;
        }
        #fullscreenBtn:hover svg {
            stroke: #1a68c7;
        }

        /* 全屏按钮在IE中的降级 (不支持 backdrop-filter) */
        .ie #fullscreenBtn {
            background: rgba(44, 123, 224, 0.20);
        }

        /* ============================================================ */
        /* ===== 全屏模式样式 ===== */
        body.fullscreen-mode {
            padding: 0;
            background: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        body.fullscreen-mode .container {
            max-width: 100%;
            height: 100vh;
            padding: 0 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 0;
        }

        /* 全屏时隐藏所有非时间元素 */
        body.fullscreen-mode .tabs,
        body.fullscreen-mode .section-title,
        body.fullscreen-mode .countdown-inputs,
        body.fullscreen-mode .btn-group {
            display: none !important;
            opacity: 0 !important;
            transform: scale(0.8) !important;
            pointer-events: none !important;
        }

        /* 全屏时面板只显示当前活动面板，且占满 */
        body.fullscreen-mode .panel {
            display: none !important;
        }
        body.fullscreen-mode .panel.active {
            display: flex !important;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 80vh;
            flex-direction: column;
            animation: none;
        }

        /* 全屏时时钟放大 */
        body.fullscreen-mode .clock-display {
            font-size: 22vw !important;
            letter-spacing: 0.06em;
            padding: 0 !important;
            line-height: 1.1;
        }

        /* 全屏时倒计时/正计时放大 */
        body.fullscreen-mode .time-display {
            font-size: 20vw !important;
            letter-spacing: 0.06em;
            padding: 0 !important;
            line-height: 1.1;
            min-height: auto;
        }

        /* 全屏时 "时间到！" 消息放大 */
        body.fullscreen-mode .time-display .timeout-msg {
            font-size: 16vw !important;
            letter-spacing: 0.04em;
        }

        body.fullscreen-mode .time-display .normal-time {
            font-size: inherit;
        }

        /* 全屏时微调正计时毫秒部分 */
        body.fullscreen-mode #panelTimer .time-display {
            font-size: 18vw !important;
        }

        /* 全屏时按钮保持可见，但稍微调整位置 */
        body.fullscreen-mode #fullscreenBtn {
            bottom: 28px;
            right: 28px;
            background: rgba(44, 123, 224, 0.20);
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.10);
        }
        body.fullscreen-mode #fullscreenBtn svg {
            stroke: #2c7be0;
        }

        /* ----- 响应式 ----- */
        @media (max-width: 480px) {
            .container {
                padding: 12px 12px 18px;
            }
            .clock-display {
                font-size: 38px;
                letter-spacing: 4px;
                padding: 12px 0;
            }
            .time-display {
                font-size: 30px;
                letter-spacing: 2px;
                padding: 8px 0;
                min-height: 48px;
            }
            .input-group input[type="number"] {
                width: 40px;
                height: 32px;
                font-size: 16px;
            }
            .step-btn {
                width: 26px;
                height: 32px;
                font-size: 16px;
                line-height: 30px;
            }
            .btn {
                padding: 6px 14px;
                font-size: 13px;
                min-width: 52px;
            }
            .section-title {
                font-size: 16px;
            }
            .tab-btn {
                padding: 8px 14px;
                font-size: 14px;
                min-width: 60px;
            }
            .countdown-inputs {
                gap: 6px;
            }
            .input-group {
                margin-left: 3px;
                margin-right: 3px;
            }
            .countdown-inputs {
                margin-left: -3px;
                margin-right: -3px;
            }
            #fullscreenBtn {
                width: 40px;
                height: 40px;
                bottom: 16px;
                right: 16px;
            }
            #fullscreenBtn svg {
                width: 20px;
                height: 20px;
            }
            body.fullscreen-mode .clock-display {
                font-size: 18vw !important;
            }
            body.fullscreen-mode .time-display {
                font-size: 16vw !important;
            }
            body.fullscreen-mode .time-display .timeout-msg {
                font-size: 14vw !important;
            }
            body.fullscreen-mode #panelTimer .time-display {
                font-size: 14vw !important;
            }
        }

        @media (max-width: 380px) {
            .input-group input[type="number"] {
                width: 32px;
                height: 28px;
                font-size: 14px;
            }
            .step-btn {
                width: 22px;
                height: 28px;
                font-size: 14px;
                line-height: 26px;
            }
            .input-group .label {
                font-size: 13px;
            }
            .btn {
                padding: 5px 10px;
                font-size: 12px;
                min-width: 44px;
            }
            .clock-display {
                font-size: 30px;
            }
            .time-display {
                font-size: 24px;
            }
            .tab-btn {
                padding: 6px 10px;
                font-size: 12px;
                min-width: 48px;
            }
            .countdown-inputs {
                gap: 4px;
            }
            #fullscreenBtn {
                width: 36px;
                height: 36px;
                bottom: 12px;
                right: 12px;
            }
            #fullscreenBtn svg {
                width: 18px;
                height: 18px;
            }
        }

        /* 横屏/大屏优化 */
        @media (min-width: 768px) {
            body.fullscreen-mode .clock-display {
                font-size: 18vw !important;
            }
            body.fullscreen-mode .time-display {
                font-size: 16vw !important;
            }
            body.fullscreen-mode .time-display .timeout-msg {
                font-size: 12vw !important;
            }
            body.fullscreen-mode #panelTimer .time-display {
                font-size: 14vw !important;
            }
        }

        /* 针对IE11 不支持 fullscreen，隐藏按钮 */
        .ie11 #fullscreenBtn {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ===== 全屏按钮 (右下角) ===== -->
    <button id="fullscreenBtn" onclick="toggleFullscreen()" title="全屏">
        <!-- 全屏图标 (默认) -->
        <svg viewBox="0 0 24 24" id="fsIcon">
            <path d="M8 3H5a2 2 0 0 0-2 2v3" />
            <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
            <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
            <path d="M3 16v3a2 2 0 0 0 2 2h3" />
        </svg>
    </button>

    <div class="container">

        <!-- ===== 标签页导航 ===== -->
        <div class="tabs" id="tabNav">
            <button class="tab-btn active" data-tab="panelClock">🕒 时钟</button>
            <button class="tab-btn" data-tab="panelCountdown">⏳ 倒计时</button>
            <button class="tab-btn" data-tab="panelTimer">▶ 正计时</button>
        </div>

        <!-- ============================================================= -->
        <!-- 面板1：当前时间 -->
        <div class="panel active" id="panelClock">
            <div class="section-title">📌 当前时间</div>
            <div class="clock-display" id="clockDisplay">00:00:00</div>
        </div>

        <!-- ============================================================= -->
        <!-- 面板2：倒计时 -->
        <div class="panel" id="panelCountdown">
            <div class="section-title">⏳ 倒计时</div>

            <!-- 编辑区域（含步进按钮） -->
            <div class="countdown-inputs" id="cdInputs">
                <!-- 时 -->
                <div class="input-group">
                    <button class="step-btn" data-target="cdHours" data-dir="-1">−</button>
                    <input type="number" id="cdHours" value="0" min="0" max="99">
                    <button class="step-btn" data-target="cdHours" data-dir="1">+</button>
                    <span class="label">时</span>
                </div>
                <!-- 分 -->
                <div class="input-group">
                    <button class="step-btn" data-target="cdMinutes" data-dir="-1">−</button>
                    <input type="number" id="cdMinutes" value="5" min="0" max="59">
                    <button class="step-btn" data-target="cdMinutes" data-dir="1">+</button>
                    <span class="label">分</span>
                </div>
                <!-- 秒 -->
                <div class="input-group">
                    <button class="step-btn" data-target="cdSeconds" data-dir="-1">−</button>
                    <input type="number" id="cdSeconds" value="0" min="0" max="59">
                    <button class="step-btn" data-target="cdSeconds" data-dir="1">+</button>
                    <span class="label">秒</span>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="btn-group">
                <button class="btn btn-success" id="cdStartBtn" onclick="cdStart()">开始</button>
                <button class="btn btn-warning" id="cdPauseBtn" onclick="cdPause()" disabled>暂停</button>
                <button class="btn btn-danger" id="cdResetBtn" onclick="cdReset()" disabled>重置</button>
            </div>

            <!-- 时间显示 -->
            <div class="time-display" id="cdDisplay">
                <span class="normal-time" id="cdTimeText">00:00:00</span>
            </div>
        </div>

        <!-- ============================================================= -->
        <!-- 面板3：正计时 -->
        <div class="panel" id="panelTimer">
            <div class="section-title">▶ 正计时 <span style="font-weight:normal; font-size:14px; color:#888;">(毫秒)</span></div>

            <div class="btn-group">
                <button class="btn btn-success" id="tmStartBtn" onclick="tmStart()">开始</button>
                <button class="btn btn-warning" id="tmPauseBtn" onclick="tmPause()" disabled>暂停</button>
                <button class="btn btn-danger" id="tmResetBtn" onclick="tmReset()" disabled>重置</button>
            </div>

            <div class="time-display" id="tmDisplay">00:00:00.000</div>
        </div>

    </div>

    <script>
        /* ============================================================
               兼容 IE：使用 var / function
               ============================================================ */

        // ---------- 检测 IE 11 ----------
        (function() {
            var isIE11 = !!window.MSInputMethodContext && !!document.documentMode;
            if (isIE11) {
                document.body.classList.add('ie11');
            }
            // 检测是否支持 backdrop-filter (IE不支持)
            if (!('backdropFilter' in document.documentElement.style)) {
                document.body.classList.add('ie');
            }
        })();

        // ---------- 标签页切换 ----------
        (function() {
            var tabs = document.querySelectorAll('.tab-btn');
            var panels = {
                clock: document.getElementById('panelClock'),
                countdown: document.getElementById('panelCountdown'),
                timer: document.getElementById('panelTimer')
            };

            function switchTab(tabId) {
                for (var key in panels) {
                    if (panels.hasOwnProperty(key)) {
                        panels[key].classList.remove('active');
                    }
                }
                var target = document.getElementById(tabId);
                if (target) target.classList.add('active');

                for (var i = 0; i < tabs.length; i++) {
                    tabs[i].classList.remove('active');
                    if (tabs[i].getAttribute('data-tab') === tabId) {
                        tabs[i].classList.add('active');
                    }
                }
            }

            for (var i = 0; i < tabs.length; i++) {
                (function(btn) {
                    btn.addEventListener('click', function() {
                        var tabId = this.getAttribute('data-tab');
                        if (tabId) switchTab(tabId);
                    });
                })(tabs[i]);
            }

            switchTab('panelClock');
        })();

        // ---------- 工具函数 ----------
        function pad(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        function pad3(n) {
            if (n < 100) return (n < 10 ? '00' : '0') + n;
            return '' + n;
        }

        function toTotalSeconds(h, m, s) {
            return h * 3600 + m * 60 + s;
        }

        function formatHMS(total) {
            if (total < 0) total = 0;
            var h = Math.floor(total / 3600);
            var m = Math.floor((total % 3600) / 60);
            var s = total % 60;
            return pad(h) + ':' + pad(m) + ':' + pad(s);
        }

        function formatHMSms(ms) {
            if (ms < 0) ms = 0;
            var totalSec = Math.floor(ms / 1000);
            var milli = ms % 1000;
            var h = Math.floor(totalSec / 3600);
            var m = Math.floor((totalSec % 3600) / 60);
            var s = totalSec % 60;
            return pad(h) + ':' + pad(m) + ':' + pad(s) + '.' + pad3(milli);
        }

        function getCountdownInputs() {
            var h = parseInt(document.getElementById('cdHours').value, 10) || 0;
            var m = parseInt(document.getElementById('cdMinutes').value, 10) || 0;
            var s = parseInt(document.getElementById('cdSeconds').value, 10) || 0;
            if (h < 0) h = 0;
            if (m < 0) m = 0;
            if (m > 59) m = 59;
            if (s < 0) s = 0;
            if (s > 59) s = 59;
            return { hours: h, minutes: m, seconds: s };
        }

        // ---------- 步进按钮 ----------
        (function() {
            var stepBtns = document.querySelectorAll('.step-btn');
            for (var i = 0; i < stepBtns.length; i++) {
                (function(btn) {
                    btn.addEventListener('click', function() {
                        var targetId = this.getAttribute('data-target');
                        var dir = parseInt(this.getAttribute('data-dir'), 10);
                        var input = document.getElementById(targetId);
                        if (!input || input.disabled) return;
                        var val = parseInt(input.value, 10) || 0;
                        var min = parseInt(input.getAttribute('min'), 10) || 0;
                        var max = parseInt(input.getAttribute('max'), 10) || 99;
                        var newVal = val + dir;
                        if (newVal < min) newVal = min;
                        if (newVal > max) newVal = max;
                        input.value = newVal;
                        var evt = document.createEvent('HTMLEvents');
                        evt.initEvent('input', true, true);
                        input.dispatchEvent(evt);
                        evt = document.createEvent('HTMLEvents');
                        evt.initEvent('change', true, true);
                        input.dispatchEvent(evt);
                    });
                })(stepBtns[i]);
            }
        })();

        // ---------- 1. 当前时钟 ----------
        function updateClock() {
            var now = new Date();
            var h = pad(now.getHours());
            var m = pad(now.getMinutes());
            var s = pad(now.getSeconds());
            document.getElementById('clockDisplay').textContent = h + ':' + m + ':' + s;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ---------- 2. 倒计时 ----------
        var cdInterval = null;
        var cdSeconds = 0;
        var cdRunning = false;
        var cdPaused = false;
        var cdFinished = false;

        function cdShowInputs(show) {
            var el = document.getElementById('cdInputs');
            if (show) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function cdSetStepButtonsEnabled(enabled) {
            var btns = document.querySelectorAll('#panelCountdown .step-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].disabled = !enabled;
            }
        }

        function cdSetInputsEnabled(enabled) {
            var inputs = document.querySelectorAll('#panelCountdown .countdown-inputs input[type="number"]');
            for (var i = 0; i < inputs.length; i++) {
                inputs[i].disabled = !enabled;
            }
            cdSetStepButtonsEnabled(enabled);
        }

        function cdUpdateDisplay() {
            var parent = document.getElementById('cdDisplay');
            if (cdFinished) {
                parent.innerHTML = '<span class="timeout-msg">⏰ 时间到！</span>';
                return;
            }
            parent.innerHTML = '<span class="normal-time">' + formatHMS(cdSeconds) + '</span>';
        }

        function cdUpdateButtons() {
            var startBtn = document.getElementById('cdStartBtn');
            var pauseBtn = document.getElementById('cdPauseBtn');
            var resetBtn = document.getElementById('cdResetBtn');

            if (cdFinished) {
                startBtn.disabled = true;
                pauseBtn.disabled = true;
                resetBtn.disabled = false;
                return;
            }
            if (cdRunning && !cdPaused) {
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                resetBtn.disabled = false;
            } else if (cdRunning && cdPaused) {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                resetBtn.disabled = false;
            } else {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                resetBtn.disabled = true;
            }
        }

        function cdStopTimer() {
            if (cdInterval) {
                clearInterval(cdInterval);
                cdInterval = null;
            }
            cdRunning = false;
        }

        function cdTick() {
            if (cdPaused) return;
            cdSeconds--;
            if (cdSeconds <= 0) {
                cdSeconds = 0;
                cdFinished = true;
                cdStopTimer();
                cdRunning = false;
                cdPaused = false;
                cdUpdateDisplay();
                cdUpdateButtons();
                cdShowInputs(true);
                cdSetInputsEnabled(true);
                return;
            }
            cdUpdateDisplay();
            cdUpdateButtons();
        }

        function cdStart() {
            if (cdFinished) {
                var vals = getCountdownInputs();
                var total = toTotalSeconds(vals.hours, vals.minutes, vals.seconds);
                if (total <= 0) { alert('请设置有效的时间（大于0）'); return; }
                cdSeconds = total;
                cdFinished = false;
                cdPaused = false;
                cdUpdateDisplay();
                cdShowInputs(false);
                cdSetInputsEnabled(false);
                cdRunning = true;
                cdInterval = setInterval(cdTick, 1000);
                cdUpdateButtons();
                return;
            }
            if (cdRunning && cdPaused) {
                cdPaused = false;
                cdUpdateButtons();
                return;
            }
            if (cdRunning) return;

            var vals = getCountdownInputs();
            var total = toTotalSeconds(vals.hours, vals.minutes, vals.seconds);
            if (total <= 0) { alert('请设置有效的时间（大于0）'); return; }
            cdSeconds = total;
            cdFinished = false;
            cdPaused = false;
            cdUpdateDisplay();
            cdShowInputs(false);
            cdSetInputsEnabled(false);
            cdRunning = true;
            cdInterval = setInterval(cdTick, 1000);
            cdUpdateButtons();
        }

        function cdPause() {
            if (!cdRunning || cdPaused || cdFinished) return;
            cdPaused = true;
            cdUpdateButtons();
        }

        function cdReset() {
            cdStopTimer();
            cdRunning = false;
            cdPaused = false;
            cdFinished = false;
            cdShowInputs(true);
            cdSetInputsEnabled(true);
            var vals = getCountdownInputs();
            var total = toTotalSeconds(vals.hours, vals.minutes, vals.seconds);
            cdSeconds = total;
            cdUpdateDisplay();
            cdUpdateButtons();
        }

        // ---------- 3. 正计时 (毫秒) ----------
        var tmInterval = null;
        var tmMilliseconds = 0;
        var tmRunning = false;
        var tmPaused = false;
        var tmStartTime = 0;
        var tmBaseMilliseconds = 0;

        function tmUpdateDisplay() {
            document.getElementById('tmDisplay').textContent = formatHMSms(tmMilliseconds);
        }

        function tmUpdateButtons() {
            var startBtn = document.getElementById('tmStartBtn');
            var pauseBtn = document.getElementById('tmPauseBtn');
            var resetBtn = document.getElementById('tmResetBtn');

            if (tmRunning && !tmPaused) {
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                resetBtn.disabled = false;
            } else if (tmRunning && tmPaused) {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                resetBtn.disabled = false;
            } else {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                resetBtn.disabled = (tmMilliseconds === 0);
            }
        }

        function tmStopTimer() {
            if (tmInterval) {
                clearInterval(tmInterval);
                tmInterval = null;
            }
            tmRunning = false;
        }

        function tmTick() {
            if (tmPaused) return;
            var now = Date.now();
            var elapsed = now - tmStartTime;
            tmMilliseconds = tmBaseMilliseconds + elapsed;
            tmUpdateDisplay();
            if (tmMilliseconds > 0) {
                document.getElementById('tmResetBtn').disabled = false;
            }
        }

        function tmStart() {
            if (tmRunning && tmPaused) {
                tmPaused = false;
                tmStartTime = Date.now();
                tmBaseMilliseconds = tmMilliseconds;
                if (tmInterval) clearInterval(tmInterval);
                tmInterval = setInterval(tmTick, 50);
                tmUpdateButtons();
                return;
            }
            if (tmRunning) return;

            tmMilliseconds = 0;
            tmBaseMilliseconds = 0;
            tmStartTime = Date.now();
            tmRunning = true;
            tmPaused = false;
            if (tmInterval) clearInterval(tmInterval);
            tmInterval = setInterval(tmTick, 50);
            tmUpdateDisplay();
            tmUpdateButtons();
        }

        function tmPause() {
            if (!tmRunning || tmPaused) return;
            tmPaused = true;
            if (tmInterval) {
                clearInterval(tmInterval);
                tmInterval = null;
            }
            tmBaseMilliseconds = tmMilliseconds;
            tmUpdateButtons();
        }

        function tmReset() {
            tmStopTimer();
            tmRunning = false;
            tmPaused = false;
            tmMilliseconds = 0;
            tmBaseMilliseconds = 0;
            tmStartTime = 0;
            tmUpdateDisplay();
            tmUpdateButtons();
        }

        // ---------- 全屏控制 ----------
        var fullscreenIcon = document.getElementById('fsIcon');

        function toggleFullscreen() {
            var el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                // 进入全屏
                if (el.requestFullscreen) {
                    el.requestFullscreen();
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                } else if (el.msRequestFullscreen) {
                    el.msRequestFullscreen();
                } else {
                    // 不支持全屏
                    return;
                }
            } else {
                // 退出全屏
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // 监听全屏变化
        function onFullscreenChange() {
            var isFull = !!(document.fullscreenElement || document.webkitFullscreenElement || document
                .msFullscreenElement);
            if (isFull) {
                document.body.classList.add('fullscreen-mode');
                // 切换图标为“退出全屏”
                fullscreenIcon.innerHTML =
                    '<path d="M8 3v3a2 2 0 0 1-2 2H3" /><path d="M21 8h-3a2 2 0 0 1-2-2V3" /><path d="M16 21v-3a2 2 0 0 1 2-2h3" /><path d="M3 16h3a2 2 0 0 1 2 2v3" />';
            } else {
                document.body.classList.remove('fullscreen-mode');
                // 切换图标为“全屏”
                fullscreenIcon.innerHTML =
                    '<path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" />';
            }
        }

        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        document.addEventListener('msfullscreenchange', onFullscreenChange);

        // 初始化：检查是否已经全屏（页面加载时可能已经是全屏状态）
        (function() {
            var isFull = !!(document.fullscreenElement || document.webkitFullscreenElement || document
                .msFullscreenElement);
            if (isFull) {
                document.body.classList.add('fullscreen-mode');
                fullscreenIcon.innerHTML =
                    '<path d="M8 3v3a2 2 0 0 1-2 2H3" /><path d="M21 8h-3a2 2 0 0 1-2-2V3" /><path d="M16 21v-3a2 2 0 0 1 2-2h3" /><path d="M3 16h3a2 2 0 0 1 2 2v3" />';
            }
        })();

        // ---------- 初始化 ----------
        (function init() {
            // 倒计时初始
            var initVals = getCountdownInputs();
            var initTotal = toTotalSeconds(initVals.hours, initVals.minutes, initVals.seconds);
            cdSeconds = initTotal;
            cdUpdateDisplay();
            cdUpdateButtons();
            cdShowInputs(true);
            cdSetInputsEnabled(true);

            // 正计时初始
            tmMilliseconds = 0;
            tmUpdateDisplay();
            tmUpdateButtons();

            // 倒计时输入框变更时同步显示（仅在非运行状态）
            var inputs = document.querySelectorAll('#panelCountdown .countdown-inputs input[type="number"]');
            for (var i = 0; i < inputs.length; i++) {
                (function(inp) {
                    inp.addEventListener('change', function() {
                        if (!cdRunning && !cdFinished) {
                            var vals = getCountdownInputs();
                            var total = toTotalSeconds(vals.hours, vals.minutes, vals.seconds);
                            cdSeconds = total;
                            cdUpdateDisplay();
                            cdUpdateButtons();
                        }
                    });
                    inp.addEventListener('input', function() {
                        if (!cdRunning && !cdFinished) {
                            var vals = getCountdownInputs();
                            var total = toTotalSeconds(vals.hours, vals.minutes, vals.seconds);
                            cdSeconds = total;
                            cdUpdateDisplay();
                            cdUpdateButtons();
                        }
                    });
                })(inputs[i]);
            }
        })();
    </script>

</body>
</html>
